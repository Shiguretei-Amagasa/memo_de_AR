<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>memodeAR - 入力</title>
<link rel="stylesheet" href="./assets/style.css?v=11">
<link rel="manifest" href="./manifest.json?v=11">
<link rel="apple-touch-icon" href="./assets/icons/memodeAR_aicon.jpg?v=11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="memodeAR">
<script src="./assets/frame.js?v=11" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="./assets/firebase-config.js?v=11"></script>
<script src="./assets/cloud-store.js?v=11"></script>
<!-- build: v11 -->
<style>
  body { padding: 24px 16px 40px; max-width: 480px; margin: 0 auto; }

  #screenMenu.active {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: calc(100vh - 64px);
    border-radius: 18px;
    padding: 24px 12px;
  }

  .menu-logo {
    display: block;
    width: 56px;
    height: 56px;
    margin: 26px auto 4px;
  }


  .screen { display: none; }
  .screen.active { display: block; }

  .menu-btn {
    display: block;
    width: 100%;
    padding: 22px 16px;
    margin-bottom: 14px;
    font-size: 16px;
    font-weight: 600;
    background: #fff;
    border: none;
    border-radius: 14px;
    box-shadow: 0 1px 4px rgba(43, 43, 43, 0.12);
    text-align: center;
  }
  .menu-btn .sub { font-size: 11px; color: var(--text-sub); font-weight: 400; margin-top: 4px; }

  .back-btn {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 13px;
    padding: 6px 0 18px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .section { margin-bottom: 14px; }
  .section .fb-content { padding: 16px; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .section-head .title { font-size: 13px; color: var(--text-sub); }
  .check-inline {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
  }
  .check-inline input { width: 16px; height: 16px; }

  select, input[type="text"], input[type="tel"], input[type="password"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
  }
  textarea { min-height: 90px; resize: vertical; }
  label.field-label { display: block; font-size: 12px; color: var(--text-sub); margin: 10px 0 4px; }
  label.field-label:first-of-type { margin-top: 0; }

  .primary-btn {
    width: 100%;
    padding: 14px;
    margin-top: 4px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
  }
  .danger-btn {
    width: 100%;
    padding: 14px;
    margin-top: 4px;
    border: none;
    border-radius: 10px;
    background: var(--accent-danger);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
  }

  .status { text-align: center; font-size: 12px; color: var(--accent-positive); height: 16px; margin-top: 10px; }

  .history-item { margin-bottom: 10px; cursor: pointer; background: #fff; }
  .history-item .fb-content { padding: 12px 14px; }
  .history-item .h-title { font-weight: 600; font-size: 14px; }
  .history-item .h-sub { color: var(--text-sub); font-size: 11px; margin-top: 2px; }
  .empty-hint { color: var(--text-sub); font-size: 13px; text-align: center; padding: 24px 0; }

  .note-preview { margin-bottom: 16px; }
  .note-preview .fb-content { padding: 16px; }
  .note-preview .p-title { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .note-preview .p-line { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ============ メニュー画面 ============ -->
<div class="screen active notebook-bg" id="screenMenu">
  <button class="menu-btn" onclick="goCreate()">
    メモを作成<div class="sub">新しいメモを作って設定する</div>
  </button>
  <button class="menu-btn" onclick="goUpdateList()">
    メモを更新<div class="sub">過去の履歴から選んで編集する</div>
  </button>
  <button class="menu-btn" onclick="goDeleteConfirm()">
    メモを削除<div class="sub">現在設定中のメモを削除する</div>
  </button>
  <img class="menu-logo" src="./assets/img/memodeAR_logo.png" alt="memodeAR">
</div>

<!-- ============ 入力フォーム画面（作成／更新 共用） ============ -->
<div class="screen" id="screenForm">
  <button class="back-btn" onclick="backFromForm()">‹ 戻る</button>

  <div class="section frame-box">
    <div class="fb-content">
      <div class="section-head">
        <span class="title">内容</span>
        <label class="check-inline">
          <input type="checkbox" id="passcodeOnDisplay"> 表示時にパスコード
        </label>
      </div>

      <select id="contentType">
        <option value="template">定型文</option>
        <option value="free">自由記述</option>
      </select>

      <div id="templateSelectWrap">
        <label class="field-label">テンプレート</label>
        <select id="templateKey">
          <option value="away">離席用</option>
          <option value="out">外出用</option>
          <option value="holiday">休日用</option>
          <option value="focus">集中用</option>
        </select>
        <div id="templateFields"></div>
      </div>

      <div id="freeTextWrap" class="hidden">
        <label class="field-label">本文</label>
        <textarea id="freeText" placeholder="自由にメモを入力してください"></textarea>
      </div>
    </div>
  </div>

  <div class="section frame-box">
    <div class="fb-content">
      <div class="section-head">
        <span class="title">連絡先</span>
        <label class="check-inline">
          <input type="checkbox" id="contactEnabled"> 電話連絡を有効にする
        </label>
      </div>
      <div id="contactWrap" class="hidden">
        <label class="field-label">電話番号</label>
        <input type="tel" id="contactPhone" placeholder="09012345678">
        <label class="check-inline" style="margin-top:10px;">
          <input type="checkbox" id="passcodeOnCall"> 発信時にパスコード
        </label>
      </div>
    </div>
  </div>

  <div class="section frame-box" id="passcodeValueSection" style="display:none;">
    <div class="fb-content">
      <label class="field-label">パスコード</label>
      <input type="password" id="passcodeValue" inputmode="numeric" placeholder="1234">
    </div>
  </div>

  <button class="primary-btn" id="formSubmitBtn" onclick="submitForm()">作成する</button>
  <div class="status" id="statusMsgForm"></div>
</div>

<!-- ============ 更新：履歴一覧画面 ============ -->
<div class="screen" id="screenUpdateList">
  <button class="back-btn" onclick="goMenu()">‹ 戻る</button>
  <div id="updateHistoryList"></div>
</div>

<!-- ============ 削除：確認画面 ============ -->
<div class="screen" id="screenDeleteConfirm">
  <button class="back-btn" onclick="goMenu()">‹ 戻る</button>
  <div id="deleteBody"></div>
</div>

<script>
const templates = {
  away: {
    label: "離席用",
    fields: [
      { key: "message", label: "離席用メッセージ", placeholder: "少々席を外しております" },
      { key: "destination", label: "行き先", placeholder: "例：会議室B" },
      { key: "returnTime", label: "戻り時間", placeholder: "例：15:30頃" },
    ]
  },
  out: {
    label: "外出用",
    fields: [
      { key: "message", label: "外出メッセージ", placeholder: "本日は外出しております" },
      { key: "destination", label: "行き先", placeholder: "例：客先訪問" },
      { key: "returnTime", label: "戻り予定", placeholder: "例：本日18時頃" },
    ]
  },
  holiday: {
    label: "休日用",
    fields: [
      { key: "message", label: "メッセージ", placeholder: "本日はお休みをいただいております" },
      { key: "returnTime", label: "次回対応日", placeholder: "例：明日9時より" },
    ]
  },
  focus: {
    label: "集中用",
    fields: [
      { key: "message", label: "集中用メッセージ", placeholder: "作業に集中しております" },
      { key: "reason", label: "理由", placeholder: "例：資料作成のため" },
      { key: "returnTime", label: "再開予定", placeholder: "例：15:00頃" },
    ]
  }
};

let formMode = "create"; // "create" または "update"
let editingId = null;

/* ---------- 画面切り替え ---------- */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function goMenu() { showScreen("screenMenu"); }

/* ---------- クラウド（Firebase）ヘルパー ---------- */
let cloudCache = null; // { active, history } を都度取りに行かず簡易キャッシュ

async function loadCloud(force) {
  if (cloudCache && !force) return cloudCache;
  cloudCache = await window.memodeCloud.fetchData();
  return cloudCache;
}
async function saveCloud(data) {
  cloudCache = data;
  await window.memodeCloud.saveData(data);
}


/* ---------- フォーム：作成 ---------- */
function goCreate() {
  formMode = "create";
  editingId = null;
  resetForm();
  document.getElementById("formSubmitBtn").textContent = "作成する";
  showScreen("screenForm");
}

function backFromForm() {
  if (formMode === "update") {
    goUpdateList();
  } else {
    goMenu();
  }
}

function resetForm() {
  document.getElementById("contentType").value = "template";
  document.getElementById("templateKey").value = "away";
  renderTemplateFields();
  templates.away.fields.forEach(f => { document.getElementById("tf_" + f.key).value = ""; });
  document.getElementById("templateSelectWrap").classList.remove("hidden");
  document.getElementById("freeTextWrap").classList.add("hidden");
  document.getElementById("freeText").value = "";
  document.getElementById("contactEnabled").checked = false;
  document.getElementById("contactWrap").classList.add("hidden");
  document.getElementById("contactPhone").value = "";
  document.getElementById("passcodeOnDisplay").checked = false;
  document.getElementById("passcodeOnCall").checked = false;
  document.getElementById("passcodeValue").value = "";
  updatePasscodeSectionVisibility();
  document.getElementById("statusMsgForm").textContent = "";
}

function renderTemplateFields() {
  const key = document.getElementById("templateKey").value;
  const wrap = document.getElementById("templateFields");
  wrap.innerHTML = "";
  templates[key].fields.forEach(f => {
    const label = document.createElement("label");
    label.className = "field-label";
    label.textContent = f.label;
    wrap.appendChild(label);
    const input = document.createElement("input");
    input.type = "text";
    input.id = "tf_" + f.key;
    input.placeholder = f.placeholder;
    wrap.appendChild(input);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("contentType").addEventListener("change", (e) => {
    const isTemplate = e.target.value === "template";
    document.getElementById("templateSelectWrap").classList.toggle("hidden", !isTemplate);
    document.getElementById("freeTextWrap").classList.toggle("hidden", isTemplate);
  });
  document.getElementById("templateKey").addEventListener("change", renderTemplateFields);
  document.getElementById("contactEnabled").addEventListener("change", (e) => {
    document.getElementById("contactWrap").classList.toggle("hidden", !e.target.checked);
    updatePasscodeSectionVisibility();
  });
  document.getElementById("passcodeOnDisplay").addEventListener("change", updatePasscodeSectionVisibility);
  document.getElementById("passcodeOnCall").addEventListener("change", updatePasscodeSectionVisibility);
  renderTemplateFields();
});

function updatePasscodeSectionVisibility() {
  const need = document.getElementById("passcodeOnDisplay").checked ||
               (document.getElementById("contactEnabled").checked && document.getElementById("passcodeOnCall").checked);
  document.getElementById("passcodeValueSection").style.display = need ? "block" : "none";
}

function collectFormData() {
  const contentType = document.getElementById("contentType").value;
  let fields = {};
  if (contentType === "template") {
    const key = document.getElementById("templateKey").value;
    templates[key].fields.forEach(f => {
      fields[f.key] = document.getElementById("tf_" + f.key).value;
    });
  } else {
    fields.freeText = document.getElementById("freeText").value;
  }
  return {
    contentType: contentType,
    templateKey: contentType === "template" ? document.getElementById("templateKey").value : null,
    templateLabel: contentType === "template" ? templates[document.getElementById("templateKey").value].label : "自由記述",
    fields: fields,
    contactEnabled: document.getElementById("contactEnabled").checked,
    contactPhone: document.getElementById("contactPhone").value,
    passcodeOnDisplay: document.getElementById("passcodeOnDisplay").checked,
    passcodeOnCall: document.getElementById("passcodeOnCall").checked,
    passcodeValue: document.getElementById("passcodeValue").value,
    updatedAt: new Date().toISOString()
  };
}

function applyFormData(data) {
  document.getElementById("contentType").value = data.contentType;
  document.getElementById("templateSelectWrap").classList.toggle("hidden", data.contentType !== "template");
  document.getElementById("freeTextWrap").classList.toggle("hidden", data.contentType === "template");

  if (data.contentType === "template") {
    document.getElementById("templateKey").value = data.templateKey;
    renderTemplateFields();
    templates[data.templateKey].fields.forEach(f => {
      document.getElementById("tf_" + f.key).value = data.fields[f.key] || "";
    });
  } else {
    document.getElementById("freeText").value = data.fields.freeText || "";
  }

  document.getElementById("contactEnabled").checked = !!data.contactEnabled;
  document.getElementById("contactWrap").classList.toggle("hidden", !data.contactEnabled);
  document.getElementById("contactPhone").value = data.contactPhone || "";
  document.getElementById("passcodeOnDisplay").checked = !!data.passcodeOnDisplay;
  document.getElementById("passcodeOnCall").checked = !!data.passcodeOnCall;
  document.getElementById("passcodeValue").value = data.passcodeValue || "";
  updatePasscodeSectionVisibility();
}

/* 保存：作成でも更新でも「履歴に保存」と「ARに反映（active化）」を必ず両方行う */
async function submitForm() {
  const btn = document.getElementById("formSubmitBtn");
  const statusEl = document.getElementById("statusMsgForm");
  btn.disabled = true;
  statusEl.textContent = "保存中…";

  try {
    const data = collectFormData();
    const cloud = await loadCloud(true);
    let list = cloud.history;

    if (formMode === "update" && editingId) {
      data.id = editingId;
      const idx = list.findIndex(n => n.id === editingId);
      if (idx !== -1) {
        list[idx] = data;
      } else {
        list.unshift(data);
      }
    } else {
      data.id = "n_" + Date.now();
      list.unshift(data);
      if (list.length > 5) list = list.slice(0, 5);
    }

    await saveCloud({ active: data, history: list });

    statusEl.textContent = formMode === "update" ? "更新してARに反映しました" : "作成してARに反映しました";
    setTimeout(() => { goMenu(); }, 700);
  } catch (e) {
    statusEl.textContent = "保存に失敗しました：" + e.message;
  } finally {
    btn.disabled = false;
  }
}

/* ---------- 更新：履歴一覧 ---------- */
async function goUpdateList() {
  const wrap = document.getElementById("updateHistoryList");
  wrap.innerHTML = '<div class="empty-hint">読み込み中…</div>';
  showScreen("screenUpdateList");

  let list = [];
  try {
    const cloud = await loadCloud(true);
    list = cloud.history;
  } catch (e) {
    wrap.innerHTML = `<div class="empty-hint">読み込みに失敗しました：${e.message}</div>`;
    return;
  }

  wrap.innerHTML = "";
  if (list.length === 0) {
    wrap.innerHTML = '<div class="empty-hint">更新できる履歴がまだありません</div>';
  } else {
    list.forEach(item => {
      const el = document.createElement("div");
      el.className = "history-item frame-box";
      const dt = new Date(item.updatedAt);
      const dtStr = (dt.getMonth()+1) + "/" + dt.getDate() + " " + String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
      el.innerHTML = `<div class="fb-content"><div class="h-title">${item.templateLabel}</div><div class="h-sub">${dtStr}</div></div>`;
      el.addEventListener("click", () => goUpdateEdit(item.id));
      wrap.appendChild(el);
    });
  }
  window.applyFrames && window.applyFrames(wrap);
}

async function goUpdateEdit(id) {
  const cloud = await loadCloud();
  const item = cloud.history.find(n => n.id === id);
  if (!item) return;
  formMode = "update";
  editingId = id;
  applyFormData(item);
  document.getElementById("formSubmitBtn").textContent = "更新する";
  document.getElementById("statusMsgForm").textContent = "";
  showScreen("screenForm");
}

/* ---------- 削除：確認画面 ---------- */
async function goDeleteConfirm() {
  const wrap = document.getElementById("deleteBody");
  wrap.innerHTML = '<div class="empty-hint">読み込み中…</div>';
  showScreen("screenDeleteConfirm");

  let cloud;
  try {
    cloud = await loadCloud(true);
  } catch (e) {
    wrap.innerHTML = `<div class="empty-hint">読み込みに失敗しました：${e.message}</div>`;
    return;
  }

  const active = cloud.active;
  wrap.innerHTML = "";

  if (!active) {
    wrap.innerHTML = '<div class="empty-hint">削除できるメモがありません</div>';
  } else {
    const lines = active.contentType === "template"
      ? Object.values(active.fields).filter(v => v)
      : [active.fields.freeText || ""];

    const preview = document.createElement("div");
    preview.className = "note-preview frame-box";
    preview.innerHTML = `<div class="fb-content">
        <div class="p-title">${active.templateLabel}</div>
        ${lines.map(l => `<div class="p-line">${l}</div>`).join("")}
      </div>`;
    wrap.appendChild(preview);

    const confirmBtn = document.createElement("button");
    confirmBtn.className = "danger-btn";
    confirmBtn.textContent = "このメモを削除する";
    confirmBtn.onclick = () => doDelete(active.id);
    wrap.appendChild(confirmBtn);
  }
  window.applyFrames && window.applyFrames(wrap);
}

async function doDelete(id) {
  try {
    const cloud = await loadCloud(true);
    const list = cloud.history.filter(n => n.id !== id);
    await saveCloud({ active: null, history: list });
  } catch (e) {
    document.getElementById("deleteBody").innerHTML = `<div class="empty-hint">削除に失敗しました：${e.message}</div>`;
    return;
  }
  goDeleteConfirm(); // 削除後、再度この画面を呼び直すと「ありません」表示になる
}
</script>
</body>
</html>
