<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>離席中メモAR - 表示</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; }
  #scanHint {
    position: fixed; top: 16px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    z-index: 20; pointer-events: none;
  }
  #passcodeOverlay, #notFoundOverlay {
    position: fixed; inset: 0;
    background: rgba(20,20,20,0.92);
    color: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 24px;
    text-align: center;
  }
  #passcodeOverlay input {
    margin-top: 16px;
    font-size: 22px;
    letter-spacing: 6px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    width: 160px;
  }
  #passcodeOverlay button, #notFoundOverlay button {
    margin-top: 16px;
    padding: 10px 24px;
    border-radius: 20px;
    border: none;
    background: #fff;
    font-size: 15px;
  }
  #passcodeError { color: #ff8080; font-size: 13px; margin-top: 8px; height: 16px; }
  a-scene { width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="scanHint">マーカーをカメラにかざしてください</div>

<div id="passcodeOverlay">
  <div>パスコードを入力してください</div>
  <input type="password" id="passcodeInput" inputmode="numeric" maxlength="8">
  <div id="passcodeError"></div>
  <button onclick="checkPasscode()">確認</button>
</div>

<div id="notFoundOverlay">
  <div>メモがまだ登録されていません。<br>先に入力ページから保存してください。</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./marker.mind; autoStart: true; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
>
  <a-assets></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="notePanel" mindar-image-target="targetIndex: 0">
    <a-plane
      color="#fdfaf3"
      opacity="0.95"
      width="1.4" height="1.0"
      position="0 0 0"
    ></a-plane>
    <a-text
      id="noteText"
      value=""
      color="#2b2b2b"
      width="1.3"
      align="left"
      position="-0.62 0.42 0.01"
      wrap-count="34"
    ></a-text>
    <a-plane
      id="callButton"
      color="#2f9e4f"
      width="0.5" height="0.15"
      position="0 -0.38 0.01"
      class="clickable"
    ></a-plane>
    <a-text
      value="電話をかける"
      color="#fff"
      align="center"
      width="1"
      position="0 -0.38 0.02"
    ></a-text>
  </a-entity>
</a-scene>

<script>
let noteData = null;
let pendingAction = null; // "display" または "call"

function loadNote() {
  try {
    const raw = localStorage.getItem("awayNoteData");
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function buildNoteText(data) {
  const lines = [];
  lines.push("【" + data.templateLabel + "】");
  Object.keys(data.fields).forEach(k => {
    if (data.fields[k]) lines.push(data.fields[k]);
  });
  return lines.join("\n");
}

function showPasscodeOverlay(action) {
  pendingAction = action;
  document.getElementById("passcodeOverlay").style.display = "flex";
  document.getElementById("passcodeInput").value = "";
  document.getElementById("passcodeError").textContent = "";
}

function checkPasscode() {
  const input = document.getElementById("passcodeInput").value;
  if (input === noteData.passcodeValue) {
    document.getElementById("passcodeOverlay").style.display = "none";
    if (pendingAction === "display") {
      renderNoteText();
    } else if (pendingAction === "call") {
      doCall();
    }
  } else {
    document.getElementById("passcodeError").textContent = "パスコードが違います";
  }
}

function renderNoteText() {
  document.getElementById("noteText").setAttribute("value", buildNoteText(noteData));
}

function doCall() {
  if (noteData.contactPhone) {
    window.location.href = "tel:" + noteData.contactPhone;
  }
}

function onMarkerFound() {
  document.getElementById("scanHint").style.display = "none";
  if (!noteData) {
    document.getElementById("notFoundOverlay").style.display = "flex";
    return;
  }
  if (noteData.passcodeMode === "display") {
    showPasscodeOverlay("display");
  } else {
    renderNoteText();
  }
}

function onMarkerLost() {
  document.getElementById("scanHint").style.display = "block";
}

document.addEventListener("DOMContentLoaded", () => {
  noteData = loadNote();

  const target = document.getElementById("notePanel");
  target.addEventListener("targetFound", onMarkerFound);
  target.addEventListener("targetLost", onMarkerLost);

  document.getElementById("callButton").addEventListener("click", () => {
    if (!noteData) return;
    if (noteData.passcodeMode === "call") {
      showPasscodeOverlay("call");
    } else {
      doCall();
    }
  });
});
</script>
</body>
</html>
