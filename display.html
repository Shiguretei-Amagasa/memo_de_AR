<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>memodeAR - AR表示</title>
<link rel="stylesheet" href="./assets/style.css">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icons/memodeAR_aicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="memodeAR">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  a-scene { width: 100%; height: 100%; }

  #scanHint {
    position: fixed; top: 16px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    z-index: 20; pointer-events: none;
  }

  /* マーカーを覆う形で出すメッセージボックス（画面中央固定のHUD） */
  #noteOverlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 78vw;
    max-width: 340px;
    padding: 20px;
    display: none;
    z-index: 15;
    background: rgba(253, 250, 243, 0.96);
  }
  #noteOverlay .tpl-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  #noteOverlay .note-line { font-size: 15px; line-height: 1.6; margin-bottom: 4px; white-space: pre-wrap; }
  #callBtn {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent-positive);
    color: #fff;
    font-size: 14px;
  }

  #passcodeOverlay, #notFoundOverlay {
    position: fixed; inset: 0;
    background: rgba(20,20,20,0.92);
    color: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 24px;
    text-align: center;
  }
  #passcodeOverlay input {
    margin-top: 16px;
    font-size: 22px;
    letter-spacing: 6px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    width: 160px;
  }
  #passcodeOverlay button, #notFoundOverlay button {
    margin-top: 16px;
    padding: 10px 24px;
    border-radius: 20px;
    border: none;
    background: #fff;
    font-size: 15px;
  }
  #passcodeError { color: #ff8080; font-size: 13px; margin-top: 8px; height: 16px; }
</style>
</head>
<body>

<div id="scanHint">マーカーをカメラにかざしてください</div>

<div id="noteOverlay" class="frame-box">
  <div class="tpl-label" id="noteTplLabel"></div>
  <div id="noteBody"></div>
  <button id="callBtn" class="hidden">電話をかける</button>
</div>

<div id="passcodeOverlay">
  <div>パスコードを入力してください</div>
  <input type="password" id="passcodeInput" inputmode="numeric" maxlength="8">
  <div id="passcodeError"></div>
  <button onclick="checkPasscode()">確認</button>
</div>

<div id="notFoundOverlay">
  <div>メモがまだ設定されていません。<br>先に入力ページで「メモに設定」してください。</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./marker.mind; autoStart: true; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="markerTarget" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<script>
const ACTIVE_KEY = "awayNoteActive";
let noteData = null;
let pendingAction = null; // "display" または "call"

function loadActiveNote() {
  try {
    const raw = localStorage.getItem(ACTIVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function buildNoteLines(data) {
  const lines = [];
  if (data.contentType === "template") {
    Object.values(data.fields).forEach(v => { if (v) lines.push(v); });
  } else {
    lines.push(data.fields.freeText || "");
  }
  return lines;
}

function renderNote() {
  document.getElementById("noteTplLabel").textContent = noteData.templateLabel;
  const body = document.getElementById("noteBody");
  body.innerHTML = "";
  buildNoteLines(noteData).forEach(line => {
    const div = document.createElement("div");
    div.className = "note-line";
    div.textContent = line;
    body.appendChild(div);
  });

  const callBtn = document.getElementById("callBtn");
  if (noteData.contactEnabled && noteData.contactPhone) {
    callBtn.classList.remove("hidden");
  } else {
    callBtn.classList.add("hidden");
  }

  document.getElementById("noteOverlay").style.display = "block";
}

function showPasscodeOverlay(action) {
  pendingAction = action;
  document.getElementById("passcodeOverlay").style.display = "flex";
  document.getElementById("passcodeInput").value = "";
  document.getElementById("passcodeError").textContent = "";
}

function checkPasscode() {
  const input = document.getElementById("passcodeInput").value;
  if (input === noteData.passcodeValue) {
    document.getElementById("passcodeOverlay").style.display = "none";
    if (pendingAction === "display") {
      renderNote();
    } else if (pendingAction === "call") {
      doCall();
    }
  } else {
    document.getElementById("passcodeError").textContent = "パスコードが違います";
  }
}

function doCall() {
  if (noteData.contactPhone) {
    window.location.href = "tel:" + noteData.contactPhone;
  }
}

function onMarkerFound() {
  document.getElementById("scanHint").style.display = "none";
  if (!noteData) {
    document.getElementById("notFoundOverlay").style.display = "flex";
    return;
  }
  if (noteData.passcodeOnDisplay) {
    showPasscodeOverlay("display");
  } else {
    renderNote();
  }
}

function onMarkerLost() {
  document.getElementById("scanHint").style.display = "block";
  document.getElementById("noteOverlay").style.display = "none";
}

document.addEventListener("DOMContentLoaded", () => {
  noteData = loadActiveNote();

  const target = document.getElementById("markerTarget");
  target.addEventListener("targetFound", onMarkerFound);
  target.addEventListener("targetLost", onMarkerLost);

  document.getElementById("callBtn").addEventListener("click", () => {
    if (!noteData) return;
    if (noteData.passcodeOnCall) {
      showPasscodeOverlay("call");
    } else {
      doCall();
    }
  });
});
</script>
</body>
</html>
